; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain build/upload must never flash the CC3000 patcher
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit CC3000 Library
build_flags = -DENABLE_CC3K_PRINTER
    ; 0 = motor only: no WiFi, web server, NTP or night schedule
    -DNETWORK_ENABLED=0

; One-off: flashes CC3000 firmware 1.14 (Adafruit patcher). Upload, open monitor, send any key.
; Afterwards upload the [env:uno] firmware again.
[env:cc3000_patch]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit CC3000 Library
build_src_filter = -<*> +<../tools/cc3000_patch/>


